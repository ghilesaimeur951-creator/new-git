name: Verify real GitHub sync
on:
  push:
    branches: [git-sync-validation]

permissions:
  contents: write

jobs:
  live-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Exercise phone commands against GitHub HTTPS
        env:
          GH_SYNC_TEST_TOKEN: ${{ github.token }}
          GH_SYNC_TEST_RUN: ${{ github.run_id }}
        run: gradle --stacktrace :app:testDebugUnitTest --tests com.ghiles.quizubuntu.GitHubLiveSyncTest
