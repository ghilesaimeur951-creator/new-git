name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compare simulator with Bash and Git
        run: |
          mkdir -p build/audit-classes
          javac -d build/audit-classes app/src/main/java/com/ghiles/quizubuntu/{VirtualMachine,CommandCatalog,ShellSyntax,TextCommands,TextFilters}.java tools/{CatalogAuditProbe,DifferentialProbe,TextCorpusProbe}.java
          python3 tools/audit_catalogue.py
          python3 tools/differential_scenarios.py

      - name: Run Ubuntu Lab command tests
        run: gradle --stacktrace :app:testDebugUnitTest

      - name: Upload Ubuntu Lab test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-lab-test-report
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            audit/catalogue-results.json
            audit/scenarios.json
          if-no-files-found: warn

      - name: Build debug APK
        run: gradle --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quiz-ubuntu-git-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
